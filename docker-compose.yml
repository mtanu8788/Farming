services:

  mongodb:
    image: mongo:8
    container_name: smart-farming-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ml-service:
    build:
      context: .
      dockerfile: backend/ml_services/Dockerfile
    container_name: smart-farming-ml
    restart: unless-stopped
    ports:
      - "5001:5001"

  backend:
    build:
      context: ./backend
    container_name: smart-farming-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/smart_farming
      FLASK_ML_SERVICE_URL: http://ml-service:5001
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build:
      context: ./frontend
    container_name: smart-farming-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data: